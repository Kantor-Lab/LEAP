planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: true
      minimum_turning_radius: 0.05
      reverse_penalty: 3.0
      change_penalty: 0.5
      cost_penalty: 150.0 
      non_straight_penalty: 1.2
      max_iterations: 2000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "REEDS_SHEPP"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      footprint: "[ [0.35, 0.45], [0.35, -0.45], [-0.8, -0.45], [-0.8, 0.45] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /ouster/scan
          sensor_frame: ouster
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 1.0
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[ [0.35, 0.45], [0.35, -0.45], [-0.8, -0.45], [-0.8, 0.45] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /ouster/scan
          sensor_frame: ouster
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.8
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    odom_topic: /odom
    robot_base_frame: base_footprint
    navigators: ['navigate_to_pose']
    default_nav_to_pose_bt_xml: "$(find-pkg-share leap_nav)/config/compute_path_only.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share leap_nav)/config/compute_path_only.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_recovery_node_bt_node
      - nav2_rate_controller_bt_node
      - nav2_clear_costmap_service_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 50.0
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    current_goal_checker: ["general_goal_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.03          # 3cm
      yaw_goal_tolerance: 0.087        # ~5 degrees
      stateful: true
      trans_stopped_velocity: 0.005
      rot_stopped_velocity: 0.005

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      allow_reversing: true
      
      # --- Slow & Steady Speed Limits ---
      use_dynamic_window: true
      desired_linear_vel: 1.0
      max_linear_accel: 0.2
      max_linear_decel: 0.2 
      max_angular_vel: 0.2
      max_angular_accel: 0.5
      
      # --- Path Tracking (Lookahead) ---
      min_lookahead_dist: 2.0
      max_lookahead_dist: 2.5
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true

      # --- Smart Cornering ---
      use_regulated_linear_velocity_scaling: true 
      regulated_linear_scaling_min_radius: 1.5 
      regulated_linear_scaling_min_speed: 0.2

      # --- Approach & Alignment ---
      use_rotate_to_heading: true 
      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.5
      approach_velocity_scaling_dist: 1.0

      # --- Collision Checking ---
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.1

      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.0